name: Build Windows Binary

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja & UV
        run: choco install ninja uv

      - name: Install static dependencies via vcpkg
        run: vcpkg install libpng:x64-windows-static zlib:x64-windows-static

      - name: Apply code patches for Windows compatibility
        shell: python
        run: |
          import glob
          import re

          # 1. Parche para error.hpp
          error_path = "legacy/vendor/png++-0.2.9/error.hpp"
          try:
              with open(error_path, "r", encoding="utf-8") as f:
                  content = f.read()
              content = content.replace(
                  "strerror_r(errnum, buf, ERRBUF_SIZE);",
                  "strncpy(buf, strerror(errnum), ERRBUF_SIZE);"
              )
              with open(error_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Parche de error.hpp aplicado con éxito.")
          except FileNotFoundError:
              pass

          # 2. Corregir y limpiar types.h (asegurar declaraciones limpias con const y sin .string())
          for filepath in glob.glob("legacy/**/types.h", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              
              # Limpiar restos anteriores si los hubiera
              updated = re.sub(r'modeBasedSrcPath\(([^)]+)\)\.string\(\)', r'modeBasedSrcPath(\1)', content)
              updated = re.sub(r'modeBasedSrcPath\(([^)]+)\)\s*const\.string\(\)\s*const', r'modeBasedSrcPath(\1) const', updated)
              
              # Asegurar firma const correcta
              updated = updated.replace("std::filesystem::path modeBasedSrcPath(CompilerMode mode);", "std::filesystem::path modeBasedSrcPath(CompilerMode mode) const;")
              updated = updated.replace("std::filesystem::path modeBasedSrcPath(DecompilerMode mode);", "std::filesystem::path modeBasedSrcPath(DecompilerMode mode) const;")
              updated = updated.replace("std::filesystem::path modeBasedSrcPath(CompilerMode mode)", "std::filesystem::path modeBasedSrcPath(CompilerMode mode) const")
              updated = updated.replace("std::filesystem::path modeBasedSrcPath(DecompilerMode mode)", "std::filesystem::path modeBasedSrcPath(DecompilerMode mode) const")

              if updated != content:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(updated)
                  print(f"Cabecera types.h corregida: {filepath}")

          # 3. Aplicar .string() únicamente en los archivos de implementación .cpp
          pattern = re.compile(r'\bmodeBasedSrcPath\(([^)]+)\)(?!\.string\(\))')
          for filepath in glob.glob("legacy/**/*.cpp", recursive=True):
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              
              updated = content
              updated = updated.replace("modeBasedSrcPath(CompilerMode::PRIMARY)", "modeBasedSrcPath(CompilerMode::PRIMARY).string()")
              updated = updated.replace("modeBasedSrcPath(CompilerMode::SECONDARY)", "modeBasedSrcPath(CompilerMode::SECONDARY).string()")
              updated = updated.replace("modeBasedSrcPath(compilerMode)", "modeBasedSrcPath(compilerMode).string()")
              updated = updated.replace("modeBasedSrcPath(mode)", "modeBasedSrcPath(mode).string()")
              updated, count = pattern.subn(r'modeBasedSrcPath(\1).string()', updated)

              if updated != content:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(updated)
                  print(f"Llamada parcheada en .cpp: {filepath}")

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DPORYTILES_BUILD_DOCS=OFF `
            -DPNG_STATIC="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib/libpng16.lib" `
            -DZLIB_STATIC="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib/zs.lib"

      - name: Build Porytiles
        env:
          PYTHONUTF8: "1"
        run: cmake --build build --config Release

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: porytiles-windows-exe
          path: build/porytiles.exe
