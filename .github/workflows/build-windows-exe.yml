name: Build Windows Binary

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja & UV
        run: choco install ninja uv

      - name: Install static dependencies via vcpkg
        run: vcpkg install libpng:x64-windows-static zlib:x64-windows-static

      - name: Apply Windows compatibility patches
        shell: python
        run: |
          import glob, re

          # 1. png++: strerror_r (POSIX) no existe en MinGW
          p = "legacy/vendor/png++-0.2.9/error.hpp"
          try:
              s = open(p, encoding="utf-8").read()
              s2 = s.replace("strerror_r(errnum, buf, ERRBUF_SIZE);",
                             "strncpy(buf, strerror(errnum), ERRBUF_SIZE);")
              if s2 != s:
                  open(p, "w", encoding="utf-8").write(s2); print("error.hpp parcheado")
          except FileNotFoundError:
              pass

          # 1.5. fast-cpp-csv-parser: evitar stringop-truncation en strncpy
          csv_path = "legacy/vendor/fast-cpp-csv-parser/csv.h"
          try:
              with open(csv_path, "r", encoding="utf-8") as f:
                  csv_content = f.read()
              csv_content = csv_content.replace(
                  "strncpy(this->file_name, file_name, sizeof(this->file_name));",
                  "std::strncpy(this->file_name, file_name, sizeof(this->file_name) - 1); this->file_name[sizeof(this->file_name) - 1] = '\\0';"
              )
              with open(csv_path, "w", encoding="utf-8") as f:
                  f.write(csv_content)
              print("Parche de fast-cpp-csv-parser aplicado con éxito.")
          except FileNotFoundError:
              pass

          # 2. .string() en TODO getter modeBased* usado como argumento.
          pat = re.compile(r'\b(modeBased\w+)\(([^()]*)\)(?=\s*[,)}])')
          for f in glob.glob("legacy/**/*.h", recursive=True) + glob.glob("legacy/**/*.cpp", recursive=True):
              s = open(f, encoding="utf-8", errors="ignore").read()
              s2, n = pat.subn(r'\1(\2).string()', s)
              if s2 != s:
                  open(f, "w", encoding="utf-8").write(s2); print(f"{f}: {n} sitios")

          # 3. Sitios manuales en driver.cpp (variables, no llamadas)
          drv = "legacy/lib/legacy/driver.cpp"
          try:
              s = open(drv, encoding="utf-8", errors="ignore").read()
              reps = [
                  ("png{frames.at(i)}", "png{frames.at(i).string()}"),
                  ("tilesPng.write(tilesetPath);", "tilesPng.write(tilesetPath.string());"),
                  ("frame.write(framePngPath);", "frame.write(framePngPath.string());"),
                  ("bottomPng.write(bottomPath);", "bottomPng.write(bottomPath.string());"),
                  ("middlePng.write(middlePath);", "middlePng.write(middlePath.string());"),
                  ("topPng.write(topPath);", "topPng.write(topPath.string());"),
                  ("paletteFileNames.emplace_back(paletteFile.c_str());",
                   "paletteFileNames.emplace_back(paletteFile.string());"),
              ]
              for a, b in reps:
                  s = s.replace(a, b)
              open(drv, "w", encoding="utf-8").write(s)
          except FileNotFoundError:
              pass

          # 4. Auditoría: lista lo que quedó sin .string() para revisión
          for f in glob.glob("legacy/**/*.h", recursive=True) + glob.glob("legacy/**/*.cpp", recursive=True):
              for i, line in enumerate(open(f, encoding="utf-8", errors="ignore"), 1):
                  if re.search(r'modeBased\w+\(', line) and ".string()" not in line:
                      print(f"REVISAR {f}:{i}: {line.strip()}")

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DPORYTILES_BUILD_DOCS=OFF `
            -DPNG_STATIC="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib/libpng16.lib" `
            -DZLIB_STATIC="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib/zs.lib"

      - name: Build Porytiles
        env:
          PYTHONUTF8: "1"
        run: cmake --build build --config Release

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: porytiles-windows-exe
          path: build/porytiles.exe
