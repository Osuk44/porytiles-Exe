name: Build Windows Binary

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja & UV
        run: choco install ninja uv

      - name: Install static dependencies via vcpkg
        run: vcpkg install libpng:x64-windows-static zlib:x64-windows-static

      - name: List vcpkg installed libs (Diagnostico)
        run: dir C:\vcpkg\installed\x64-windows-static\lib

      - name: Apply code patches for Windows compatibility
        shell: bash
        run: |
          sed -i 's/strerror_r(errnum, buf, ERRBUF_SIZE);/strncpy(buf, strerror(errnum), ERRBUF_SIZE);/g' legacy/vendor/png++-0.2.9/error.hpp
          sed -i 's/modeBasedSrcPath(CompilerMode::SECONDARY)/modeBasedSrcPath(CompilerMode::SECONDARY).string()/g' legacy/lib/legacy/compiler.cpp
          sed -i 's/modeBasedSrcPath(CompilerMode::SECONDARY)/modeBasedSrcPath(CompilerMode::SECONDARY).string()/g' legacy/lib/legacy/decompiler.cpp

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DPORYTILES_BUILD_DOCS=OFF `
            -DPNG_STATIC="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib/libpng16.lib" `
            -DZLIB_STATIC="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/lib/zs.lib"

      - name: Build Porytiles
        run: cmake --build build --config Release

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: porytiles-windows-exe
          path: build/porytiles.exe
